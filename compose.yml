services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: halite
      POSTGRES_PASSWORD: halite
      POSTGRES_DB: halite
    volumes:
      - halite-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "halite"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://halite:halite@db:5432/halite
      COOKIE_SECRET: ${COOKIE_SECRET:?Run scripts/gen-bootstrap-secret.sh and set COOKIE_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  halite-pg:
