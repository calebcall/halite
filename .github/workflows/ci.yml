name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: cd backend && ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Pytest
        env:
          HALITE_TEST_PG: ${{ matrix.db == 'postgres' && '1' || '0' }}
        run: cd backend && pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          cd frontend
          npm ci
      - name: Type-check
        run: cd frontend && npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: cd frontend && npm run lint
      - name: Tests
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [tests, lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t halite:ci .
      - name: Smoke test
        run: |
          docker run -d --name halite-ci \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/h.db \
            -e COOKIE_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))") \
            -e COOKIE_SECURE=false \
            -e BOOTSTRAP_ADMIN_USERNAME=admin \
            -e BOOTSTRAP_ADMIN_PASSWORD=changeme \
            -p 8080:8080 halite:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "healthz never came up"; docker logs halite-ci; exit 1
