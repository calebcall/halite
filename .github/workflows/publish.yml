name: Publish images

# Builds the Halite app image and the mock-salt-api image and pushes them to
# Docker Hub under the calebcall org. Requires two repo secrets:
#   DOCKERHUB_USERNAME - Docker Hub user with push access to the calebcall org
#   DOCKERHUB_TOKEN    - a Docker Hub access token (Account Settings -> Security)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: calebcall/halite
            context: .
            dockerfile: ./Dockerfile
            build_args: |
              BUILD_HASH=${{ github.sha }}
          - name: mock-salt-api
            image: calebcall/mock-salt-api
            context: ./mock-salt-api
            dockerfile: ./mock-salt-api/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ var.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # latest only on a release tag; main pushes get the `edge` tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
