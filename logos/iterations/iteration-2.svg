<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Halite — lowercase "h", iteration 2.

    Verticals (ascender + right descender) stay as rounded-square pixel cells
    so the salt-grain idea reads. The SHOULDER is now one continuous path
    with a flat left edge that butts cleanly into the ascender column and
    a full semicircle on the right end, hanging the right descender below.

    Geometry: ascender right edge sits at x=196. The shoulder path runs
    from x=196 to x=364 (the right edge of the glyph grid) at y=232–280.
  -->
  <g id="icon" fill="#e5a00d">
    <!-- Ascender — left column, 7 rows, 8u gaps -->
    <rect x="148" y="64"  width="48" height="48" rx="12"/>
    <rect x="148" y="120" width="48" height="48" rx="12"/>
    <rect x="148" y="176" width="48" height="48" rx="12"/>
    <rect x="148" y="232" width="48" height="48" rx="12"/>
    <rect x="148" y="288" width="48" height="48" rx="12"/>
    <rect x="148" y="344" width="48" height="48" rx="12"/>
    <rect x="148" y="400" width="48" height="48" rx="12"/>

    <!--
      Shoulder — tongue shape: square left edge flush with the ascender, full
      semicircle on the right. Replaces the three separate pixel squares from
      iteration 1 so the horizontal stroke reads as one smooth element.
    -->
    <path d="M 196 232 L 340 232 A 24 24 0 0 1 340 280 L 196 280 Z"/>

    <!-- Right descender — 3 pixel cells, hangs below the shoulder curve -->
    <rect x="316" y="288" width="48" height="48" rx="12"/>
    <rect x="316" y="344" width="48" height="48" rx="12"/>
    <rect x="316" y="400" width="48" height="48" rx="12"/>
  </g>

  <!-- Scattered grain pixels — unchanged from iteration 1 -->
  <g id="grains" fill="#e5a00d">
    <rect x="56"  y="92"  width="24" height="24" rx="6" fill-opacity="0.55"/>
    <rect x="20"  y="220" width="20" height="20" rx="5" fill-opacity="0.4"/>
    <rect x="76"  y="392" width="22" height="22" rx="6" fill-opacity="0.5"/>
    <rect x="32"  y="468" width="18" height="18" rx="5" fill-opacity="0.4"/>
    <rect x="424" y="88"  width="22" height="22" rx="6" fill-opacity="0.5"/>
    <rect x="484" y="168" width="18" height="18" rx="5" fill-opacity="0.4"/>
    <rect x="400" y="296" width="24" height="24" rx="6" fill-opacity="0.6"/>
    <rect x="452" y="408" width="22" height="22" rx="6" fill-opacity="0.5"/>
    <rect x="412" y="470" width="18" height="18" rx="5" fill-opacity="0.4"/>
  </g>
</svg>
