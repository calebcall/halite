<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240">
  <!--
    Halite wordmark. Inter Semibold (600), tracked slightly tight for a
    confident, modern feel. Requires Inter to be available wherever this
    SVG renders (Google Fonts in the brand kit, locally installed for
    PNG export). Falls back to system sans-serif if Inter is missing.
  -->
  <text x="12" y="186"
        font-family="'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="200"
        font-weight="600"
        letter-spacing="-3"
        fill="#e5a00d">halite</text>
</svg>
