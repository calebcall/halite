services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/halite.db
      COOKIE_SECRET: ${COOKIE_SECRET:?Run scripts/gen-bootstrap-secret.sh and set COOKIE_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SALT_API_URL: ${SALT_API_URL:-}
      SALT_API_USERNAME: ${SALT_API_USERNAME:-}
      SALT_API_PASSWORD: ${SALT_API_PASSWORD:-}
      SALT_API_VERIFY: ${SALT_API_VERIFY:-true}
      SALT_API_EAUTH: ${SALT_API_EAUTH:-pam}
      INVENTORY_REFRESH_MINUTES: ${INVENTORY_REFRESH_MINUTES:-0}
      INVENTORY_REFRESH_INITIAL_DELAY_S: ${INVENTORY_REFRESH_INITIAL_DELAY_S:-30}
      FLEET_POLL_INTERVAL_SECONDS: ${FLEET_POLL_INTERVAL_SECONDS:-0}
      MINION_STATE_KEYS_INTERVAL_SECONDS: ${MINION_STATE_KEYS_INTERVAL_SECONDS:-0}
      MINION_STATE_PRESENCE_INTERVAL_SECONDS: ${MINION_STATE_PRESENCE_INTERVAL_SECONDS:-0}
      MINION_STATE_GRAINS_INTERVAL_SECONDS: ${MINION_STATE_GRAINS_INTERVAL_SECONDS:-0}
      MINION_STATE_INITIAL_DELAY_SECONDS: ${MINION_STATE_INITIAL_DELAY_SECONDS:-10}
      HALITE_STATIC_DIR: /app/frontend/dist
    volumes:
      - halite-sqlite:/data
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  halite-sqlite:
