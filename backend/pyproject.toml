[project]
name = "halite"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Halite backend"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy==2.0.*",
    "alembic==1.13.*",
    "asyncpg==0.30.*",
    "aiosqlite==0.20.*",
    "argon2-cffi==23.1.*",
    "itsdangerous==2.2.*",
    "httpx==0.27.*",
    "structlog==24.4.*",
    "greenlet==3.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==5.0.*",
    "ruff==0.6.*",
    "testcontainers[postgres]==4.8.*",
    "psycopg2-binary==2.9.*",
    "anyio==4.6.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
